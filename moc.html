<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MOC Desk</title><script src="https://cdn.tailwindcss.com"></script><script src="portal.js"></script></head><body class="bg-slate-950 text-white min-h-screen"><header class="p-5 border-b border-slate-800 flex justify-between"><div><b class="text-xl">MOC OPERATIONS</b><p class="text-xs text-slate-500">Aeronexares Hub · fleet desk routing</p></div><button onclick="logout()" class="text-cyan-300">SIGN OUT</button></header><main class="p-6 max-w-6xl mx-auto"><p class="text-slate-400 mb-6">MOC user: <span data-user></span></p><section id="home"><h1 class="text-2xl font-semibold mb-4">Select fleet desk</h1><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${['B777','B787','B737','A320'].map(f=>`<button onclick="openDesk('${f}')" class="bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl p-6 text-left"><b class="text-xl text-cyan-300">${f}</b><p class="text-slate-400 text-sm mt-2">Open ${f} issue desk</p></button>`).join('')}</div></section><section id="desk" class="hidden"><div class="flex justify-between items-center mb-4"><div><button onclick="showHome()" class="text-cyan-300">← HOME</button><h1 id="deskTitle" class="text-2xl font-semibold mt-3"></h1></div><button onclick="loadDesk()" class="bg-cyan-700 px-4 py-2 rounded">REFRESH</button></div><div id="issues" class="space-y-4"></div></section></main><script>requireRole('MOC');let current='';function openDesk(f){current=f;document.getElementById('home').classList.add('hidden');document.getElementById('desk').classList.remove('hidden');document.getElementById('deskTitle').textContent=f+' ISSUE DESK';loadDesk()}function showHome(){document.getElementById('desk').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}async function loadDesk(){const box=document.getElementById('issues');box.innerHTML='<p class="text-slate-400">Loading...</p>';const data=await hub('/moc/issues',{issues:[]});let rows=(data.issues||data||[]).filter(x=>(x.fleet||'').startsWith(current));if(!rows.length){box.innerHTML='<div class="bg-slate-900 rounded-xl p-6 text-slate-400">No issues received for this fleet.</div>';return}box.innerHTML=rows.map(x=>`<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="flex justify-between"><h2 class="text-lg text-cyan-300">${x.manual||'Document not found'} · ATA ${x.ata||'—'}</h2><span class="text-xs bg-slate-800 px-2 py-1 rounded">${x.status||'PENDING'}</span></div><div class="grid sm:grid-cols-2 gap-2 mt-3 text-sm text-slate-300"><div><b>User:</b> ${x.userId||'—'}</div><div><b>Station:</b> ${x.station||'—'}</div><div><b>Nose:</b> ${x.nose||'—'}</div><div><b>Location:</b> ${x.location||'—'}</div></div><div class="flex gap-3 mt-4">${x.contextImage?`<img src="${x.contextImage}" class="w-36 h-28 object-cover rounded" alt="Context">`:''}${x.extractedImage?`<img src="${x.extractedImage}" class="w-36 h-28 object-cover rounded" alt="Extracted">`:''}</div></article>`).join('')}</script></body></html>

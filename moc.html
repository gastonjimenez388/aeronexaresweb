<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MOC Desk</title><script src="https://cdn.tailwindcss.com"></script><script src="portal.js?v=workflow6"></script></head>
<body class="bg-slate-950 text-white min-h-screen">
<header class="p-5 border-b border-slate-800 flex justify-between"><div><b class="text-xl">MOC OPERATIONS</b><p class="text-xs text-slate-500">Aeronexares Hub · fleet desk routing</p></div><button onclick="logout()" class="text-cyan-300">SIGN OUT</button></header>
<main class="p-6 max-w-6xl mx-auto"><p class="text-slate-400 mb-6">MOC user: <span data-user></span></p>
<section id="home"><h1 class="text-2xl font-semibold mb-4">Select fleet desk</h1><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
<button onclick="openDesk('B777')" class="bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl p-6 text-left"><b class="text-xl text-cyan-300">B777</b><p class="text-slate-400 text-sm mt-2">Open B777 desk</p></button><button onclick="openDesk('B787')" class="bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl p-6 text-left"><b class="text-xl text-cyan-300">B787</b><p class="text-slate-400 text-sm mt-2">Open B787 desk</p></button><button onclick="openDesk('B737')" class="bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl p-6 text-left"><b class="text-xl text-cyan-300">B737</b><p class="text-slate-400 text-sm mt-2">Open B737 desk</p></button><button onclick="openDesk('A320')" class="bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl p-6 text-left"><b class="text-xl text-cyan-300">A320</b><p class="text-slate-400 text-sm mt-2">Open A320 desk</p></button>
</div></section>
<section id="desk" class="hidden"><div class="flex justify-between items-center mb-4"><div><button onclick="showHome()" class="text-cyan-300">← HOME</button><h1 id="deskTitle" class="text-2xl font-semibold mt-3"></h1></div><button onclick="loadDesk()" class="bg-cyan-700 px-4 py-2 rounded">REFRESH</button></div><div id="statusFilters" class="flex flex-wrap gap-2 mb-5" role="group" aria-label="Filter issues by status"></div><div id="issues" class="space-y-4"></div></section>
</main>
<script>
const MOC_API='https://aeronexares.tail027590.ts.net';requireRole('MOC');let current='';let statusFilter='ALL';let deskRows=[];let lastRenderedSignature='';
const statusOptions=[['ALL','ALL'],['PENDING','PENDING'],['UNDER_REVIEW','UNDER REVIEW'],['COMPLETE','COMPLETE']];
function openDesk(f){current=f;statusFilter='ALL';lastRenderedSignature='';document.getElementById('home').classList.add('hidden');document.getElementById('desk').classList.remove('hidden');document.getElementById('deskTitle').textContent=f+' desk';renderStatusFilters();loadDesk();}
function showHome(){document.getElementById('desk').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}
async function setIssueStatus(id,status){const result=await hubUpdate('/moc/issues/'+encodeURIComponent(id)+'/status',{status});if(!result){alert('Unable to update issue status');return;}loadDesk();}
function badge(status){const colors={PENDING:'bg-amber-900 text-amber-200',UNDER_REVIEW:'bg-blue-900 text-blue-200',COMPLETE:'bg-green-900 text-green-200'};return '<span class="text-xs px-2 py-1 rounded '+(colors[status]||colors.PENDING)+'">'+status.replace('_',' ')+'</span>';}
function renderStatusFilters(){const target=document.getElementById('statusFilters');if(!target)return;target.innerHTML=statusOptions.map(([key,label])=>{const count=key==='ALL'?deskRows.length:deskRows.filter(x=>String(x.status||'PENDING').toUpperCase()===key).length;const palette={ALL:['bg-cyan-600 text-white border-cyan-400','bg-slate-900 text-slate-300 border-slate-700 hover:border-cyan-400'],PENDING:['bg-amber-700 text-amber-100 border-amber-500','bg-amber-950/40 text-amber-200 border-amber-800 hover:border-amber-500'],UNDER_REVIEW:['bg-blue-700 text-blue-100 border-blue-500','bg-blue-950/40 text-blue-200 border-blue-800 hover:border-blue-500'],COMPLETE:['bg-green-700 text-green-100 border-green-500','bg-green-950/40 text-green-200 border-green-800 hover:border-green-500']};const active=statusFilter===key?palette[key][0]:palette[key][1];return '<button type="button" onclick="setStatusFilter(\''+key+'\')" class="'+active+' border px-3 py-2 rounded text-sm"><span class="font-semibold">'+count+'</span> '+label+'</button>';}).join('');}
function setStatusFilter(filter){statusFilter=filter;renderStatusFilters();renderRows();}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function documentBlock(x){const label=[x.manual,x.ata?'ATA '+x.ata:''].filter(Boolean).join(' · ')||'Document not found';const link=x.documentLink||x.link||x.pinpointLink||'';return '<div class="bg-slate-800/90 border border-slate-700 rounded-lg p-4"><div class="text-xs font-semibold tracking-wide text-slate-300 mb-3">DOCUMENTS</div>'+(link?'<a href="'+esc(link)+'" target="_blank" rel="noopener" class="block bg-green-600 hover:bg-green-500 text-white rounded px-3 py-2 text-sm font-semibold">'+esc(label)+' · OPEN DOCUMENT</a>':'<div class="bg-green-600/90 text-green-50 rounded px-3 py-2 text-sm font-semibold">'+esc(label)+'</div>')+'</div>';}
function renderIssueCard(x){const status=String(x.status||'PENDING').toUpperCase();const imageMarkup=(x.attachmentUrls||[]).map((url,i)=>'<img data-image-url="'+esc(url)+'" loading="lazy" onclick="openImageViewer(this)" class="w-40 h-32 object-cover rounded border border-slate-700 cursor-zoom-in" alt="Attachment '+(i+1)+'" title="Open image">').join('');const partName=x.partName||x.part_name||'';return '<article class="bg-slate-900/95 border border-slate-700 rounded-xl p-4 md:p-5 shadow-lg shadow-slate-950/30"><div class="grid grid-cols-1 lg:grid-cols-4 gap-5 items-start"><div class="space-y-2"><div class="inline-block bg-slate-800 border border-cyan-500/70 text-cyan-100 rounded-lg px-3 py-2 text-xl font-semibold shadow-sm">Nose: '+esc(x.nose||'—')+'</div><div class="bg-slate-800/80 border border-slate-700 text-slate-200 rounded-md px-3 py-2 text-sm"><span class="text-cyan-300 font-semibold">Station:</span> '+esc(x.station||'—')+'</div><div class="bg-slate-800/80 border border-slate-700 text-slate-200 rounded-md px-3 py-2 text-sm"><span class="text-cyan-300 font-semibold">User:</span> '+esc(x.userId||'—')+'</div>'+(partName?'<div class="bg-slate-800/80 border border-slate-700 text-slate-200 rounded-md px-3 py-2 text-sm"><span class="text-cyan-300 font-semibold">Part name:</span> '+esc(partName)+'</div>':'')+'<div class="text-sm text-slate-300"><b class="text-cyan-300">Assigned MOC:</b> '+esc(x.assignedTo||'Unassigned')+'</div></div>'+documentBlock(x)+'<div class="bg-slate-800/95 border border-slate-700 text-slate-200 rounded-3xl p-5 min-h-[190px] flex flex-col"><div class="text-xs font-semibold tracking-wide text-cyan-300 mb-4">CHATROOM</div><p class="text-sm text-slate-400 flex-1">No conversation yet.</p><div class="bg-lime-400/90 text-slate-900 rounded-xl px-3 py-2 text-sm self-start">Waiting for MOC notes</div></div><div class="flex lg:flex-col items-start gap-3"><div>'+badge(status)+'</div><button type="button" disabled class="w-full bg-slate-800 border border-slate-700 text-slate-500 px-3 py-2 rounded text-sm cursor-not-allowed">ADD ENGINEER</button><button type="button" disabled class="w-full bg-slate-800 border border-slate-700 text-slate-500 px-3 py-2 rounded text-sm cursor-not-allowed">ADD PLANNER</button></div></div><div class="flex flex-wrap gap-3 mt-5">'+imageMarkup+'</div><div class="flex flex-wrap gap-2 mt-4"><button onclick="setIssueStatus(\''+esc(x.eventId)+'\',\'UNDER_REVIEW\')" class="bg-blue-700 hover:bg-blue-600 px-3 py-2 rounded text-sm">START REVIEW</button><button onclick="setIssueStatus(\''+esc(x.eventId)+'\',\'COMPLETE\')" class="bg-green-700 hover:bg-green-600 px-3 py-2 rounded text-sm">MARK COMPLETE</button><button onclick="setIssueStatus(\''+esc(x.eventId)+'\',\'PENDING\')" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-sm">RESET PENDING</button><span class="text-sm text-slate-300 ml-auto self-center"><b>Updated:</b> '+esc(x.updatedAt||'—')+'</span></div></article>';}
function renderRows(){const box=document.getElementById('issues');const rows=deskRows.filter(x=>statusFilter==='ALL'||String(x.status||'PENDING').toUpperCase()===statusFilter);if(!deskRows.length){box.innerHTML='<div class="bg-slate-900 rounded-xl p-6 text-slate-400">No issues received for this fleet.</div>';box.dataset.loaded='true';return;}if(!rows.length){box.innerHTML='<div class="bg-slate-900 rounded-xl p-6 text-slate-400">No issues match this status.</div>';box.dataset.loaded='true';return;}box.innerHTML=rows.map(renderIssueCard).join('');box.dataset.loaded='true';hydrateImages();}async function loadDesk(){const box=document.getElementById('issues');if(!box.dataset.loaded)box.innerHTML='<p class="text-slate-400">Loading...</p>';const data=await hub('/moc/issues',{issues:[]});const all=Array.isArray(data)?data:(Array.isArray(data.issues)?data.issues:[]);const nextRows=all.filter(x=>String(x.fleet||'').toUpperCase().startsWith(String(current).toUpperCase()));const nextSignature=JSON.stringify(nextRows);deskRows=nextRows;renderStatusFilters();if(nextSignature===lastRenderedSignature)return;lastRenderedSignature=nextSignature;renderRows();}
function openImageViewer(img){if(!img.src||img.src===window.location.href)return;window.open(img.src,'_blank','noopener,noreferrer');}
async function hydrateImages(){const user=JSON.parse(sessionStorage.getItem('portalUser')||'{}');const token=user.accessToken||'';document.querySelectorAll('[data-image-url]').forEach(async(img)=>{try{const r=await fetch(MOC_API+img.dataset.imageUrl,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const old=img.dataset.objectUrl;if(old)URL.revokeObjectURL(old);const objectUrl=URL.createObjectURL(await r.blob());img.dataset.objectUrl=objectUrl;img.src=objectUrl;}catch(_){}});}setInterval(()=>{if(current)loadDesk();},15000);
</script></body></html>

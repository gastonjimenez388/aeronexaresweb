<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin Metrics</title><script src="https://cdn.tailwindcss.com"></script><script src="portal.js"></script></head><body class="bg-slate-950 text-white min-h-screen"><header class="p-5 border-b border-slate-800 flex justify-between"><b>ADMIN METRICS</b><button onclick="logout()" class="text-cyan-300">SIGN OUT</button></header><main class="p-6 max-w-6xl mx-auto"><p class="text-slate-400 mb-6">Signed in: <span data-user></span></p><div id="cards" class="grid md:grid-cols-4 gap-4"></div><section class="mt-8 bg-slate-900 rounded-xl p-5"><h2 class="font-bold mb-4">Global filters</h2><div class="grid md:grid-cols-4 gap-3"><select class="bg-slate-950 p-3 rounded"><option>All stations</option></select><select class="bg-slate-950 p-3 rounded"><option>All users</option></select><select class="bg-slate-950 p-3 rounded"><option>All models</option></select><select class="bg-slate-950 p-3 rounded"><option>This month</option></select></div></section></main><script>if(requireRole('ADMIN')){const data={searches:0,documents:0,accuracy:'0%',response:'0 s'};cards.innerHTML=Object.entries(data).map(([k,v])=>`<div class="bg-slate-900 border border-slate-800 rounded-xl p-5"><p class="text-slate-400 uppercase text-xs">${k}</p><strong class="text-3xl">${v}</strong></div>`).join('')}</script></body></html>

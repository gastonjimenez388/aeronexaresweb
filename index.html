    <style>
        :root {
            --cyan-glow: #00d4ff;
            --deep-dark: #010409;
            --panel-bg: rgba(13, 17, 23, 0.9);
            --ui-border: rgba(0, 212, 255, 0.2);

        }
        body {
            background-color: var(--deep-dark);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        .font-display { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .viz-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .stellar-fusion {
            width: 100%;
            max-width: 900px;
            height: auto;
            -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 80%);
            mask-image: radial-gradient(circle at center, black 45%, transparent 80%);
            filter: contrast(1.1) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .mesh-container { position: relative; overflow: hidden; }
        .mesh-grid {
            position: absolute; inset: -50% 0;
            background-image: linear-gradient(rgba(0, 212, 255, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.12) 1px, transparent 1px);
            background-size: 50px 50px; transform: perspective(1000px) rotateX(45deg);
            animation: meshFlow 40s linear infinite; z-index: 0; opacity: 0.2;
        }
        @keyframes meshFlow { 0% { transform: perspective(1000px) rotateX(45deg) translateY(0); } 100% { transform: perspective(1000px) rotateX(45deg) translateY(50px); } }
        .glass-card { background: var(--panel-bg); backdrop-filter: blur(25px); border: 1px solid var(--ui-border); }
        .glow-text { text-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--cyan-glow); box-shadow: 0 0 15px var(--cyan-glow);
            animation: scan 5s linear infinite; z-index: 10;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        .entity-card {
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .entity-card:hover { border-left-color: var(--cyan-glow); background: rgba(0, 212, 255, 0.03); }

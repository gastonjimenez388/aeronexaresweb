<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Aeronexares Portal Access</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center"><form id="login" class="w-full max-w-sm bg-slate-900 border border-cyan-500/30 rounded-xl p-8 space-y-5"><h1 class="text-xl font-bold tracking-widest">AERONEXARES PORTAL</h1><p class="text-slate-400 text-sm">Restricted operations access</p><input id="user" required placeholder="User ID" class="w-full bg-slate-950 border border-slate-700 p-3 rounded"><select id="role" class="w-full bg-slate-950 border border-slate-700 p-3 rounded"><option>ADMIN</option><option>MOC</option><option>TRAINER</option></select><input id="password" type="password" required placeholder="Password" class="w-full bg-slate-950 border border-slate-700 p-3 rounded"><button class="w-full bg-cyan-400 text-slate-950 font-bold p-3 rounded">SIGN IN</button><p id="error" class="text-red-400 text-sm"></p></form><script>login.onsubmit=e=>{e.preventDefault();const id=user.value.trim();const role=document.getElementById('role').value;if(!id||!password.value)return;if((role==='ADMIN'&&id!=='admin')||(role==='MOC'&&id!=='moc')||(role==='TRAINER'&&id!=='trainer')){error.textContent='Invalid role credentials';return}sessionStorage.setItem('portalUser',JSON.stringify({id,role}));location.href=role==='ADMIN'?'admin.html':role==='MOC'?'moc.html':'audit.html'}</script></body></html>

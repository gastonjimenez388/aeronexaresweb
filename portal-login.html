<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Aeronexares Portal Access</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-white grid place-items-center">
<form id="login" class="w-full max-w-sm bg-slate-900 border border-cyan-500/30 rounded-xl p-8 space-y-5">
<h1 class="text-xl font-bold tracking-widest">AERONEXARES PORTAL</h1><p class="text-slate-400 text-sm">Restricted operations access</p>
<input id="user" required autocomplete="username" placeholder="User ID" class="w-full bg-slate-950 border border-slate-700 p-3 rounded">
<select id="role" class="w-full bg-slate-950 border border-slate-700 p-3 rounded" aria-label="Portal role"><option value="ADMIN">ADMIN</option><option value="MOC">MOC</option><option value="AUDIT">AUDIT</option></select>
<input id="password" type="password" required autocomplete="current-password" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 p-3 rounded">
<button type="submit" class="w-full bg-cyan-400 text-slate-950 font-bold p-3 rounded">SIGN IN</button><p id="error" class="text-red-400 text-sm" role="alert"></p>
</form>
<script>
const API_BASE='https://aeronexares.tail027590.ts.net/api';
document.getElementById('login').addEventListener('submit',async(event)=>{
 event.preventDefault();const error=document.getElementById('error');error.textContent='';const user=document.getElementById('user').value.trim();const role=document.getElementById('role').value;const password=document.getElementById('password').value;
 try{const response=await fetch(API_BASE+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,role,password})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.authenticated)throw new Error('invalid');sessionStorage.setItem('portalUser',JSON.stringify({id:result.id,role:result.role,accessToken:result.accessToken}));window.location.href=(result.page||'moc.html')+'?v=workflow3';}
 catch(_){error.textContent='Invalid user, password, or role. Check hub connection.';}
});
</script></body></html>
